<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Swipe It | Reaction Velocity</title>
<!-- SWIPE IT — Reaction Mobile (phones only).
     An arrow appears after a random wait: swipe that way, anywhere on
     the screen. The time from the arrow to the swipe is the reaction,
     shown in BPM. Touching before the arrow, or a swipe under
     120 ms (a guess, not a reaction) = too early; the wrong way,
     a tap instead of a swipe, or waiting too long = a miss.
     10 arrows. Saves to vr_mobile_standings (game_key 'swipe-it'). -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.pill{padding:8px 14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font:900 .72rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;cursor:pointer}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.t{font-size:2rem;font-weight:900;font-style:italic;letter-spacing:.05em;text-transform:uppercase;text-align:center;margin-top:18px;text-shadow:0 0 30px rgba(0,229,255,.5)}
.t span{color:#00e5ff}
.sub{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#9fb3c8;margin:6px 0 18px;text-align:center}
.how{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.how div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:.95rem;font-weight:700;line-height:1.3}
.how b{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#00e5ff;color:#000;font-size:.95rem}
.name-input{width:100%;max-width:320px;padding:14px;border-radius:14px;border:2px solid rgba(0,229,255,.4);background:rgba(255,255,255,.06);color:#fff;font-size:1.05rem;text-align:center}
.go{width:100%;max-width:320px;margin-top:14px;padding:18px;border:0;border-radius:16px;background:linear-gradient(135deg,#00e5ff,#0091ff);color:#031018;font:900 1.15rem Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
/* play */
#play{padding:0;touch-action:none}
#bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 0;font-size:.8rem;font-weight:900;letter-spacing:.1em;color:#9fb3c8;pointer-events:none}
#msg{position:absolute;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));text-align:center;font-size:1.3rem;font-weight:900;letter-spacing:.05em;pointer-events:none}
#msg.bad{color:#ff6b6b}#msg.good{color:#3ddc84}
#arrow{position:absolute;left:50%;top:42%;width:clamp(180px,30vmin,300px);height:clamp(180px,30vmin,300px);transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:4px solid rgba(0,229,255,.25);background:rgba(0,229,255,.05);pointer-events:none}
#arrow svg{width:66%;height:66%;transition:none;opacity:0}
#arrow.on{border-color:#00e5ff;background:rgba(0,229,255,.12);box-shadow:0 0 50px rgba(0,229,255,.45)}
#arrow.on svg{opacity:1}

#end{overflow-y:auto;justify-content:flex-start}
#end>*{flex-shrink:0}   /* a long end screen scrolls instead of squeezing lines together */
.big{font-size:4.2rem;font-weight:900;line-height:1;margin-top:10px;color:#00e5ff;text-shadow:0 0 30px rgba(0,229,255,.5)}
.lab{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#9fb3c8;margin:4px 0 10px}
#pbMsg{text-align:center;margin:2px 0 10px;min-height:1em}
.hm{font-size:.95rem;font-weight:800;margin-bottom:12px;color:#c8ccd4}
.card{width:100%;max-width:380px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);padding:12px;margin-bottom:12px}
.card h3{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#9fb3c8;margin-bottom:8px}
.taps{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.taps div{font-size:.82rem;font-weight:800;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.taps .x{color:#ff8a8a}
.btns{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.btns .go{max-width:none;margin:0}
.btn2{padding:15px;border-radius:16px;border:2px solid rgba(0,229,255,.45);background:transparent;color:#fff;font:900 .95rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer}
</style>
<!-- The player: one name for every game (see jugador.js) -->
<script>(function(){var m=false;try{m=sessionStorage.getItem('rm-gate-pass')==='1'}catch(e){}
  // a Reaction Mobile code (phones) or a Reaction Velocity code (the hub at vreaction.com)
  window.JUGADOR={modo:'juego',aqui:true,hub:m?'mobile-hub.html':'reaction-velocity.html',escuela:m?'rm-school':'reaction-velocity-school',categoria:m?'rm-category':'reaction-velocity-category',tablas:['vr_mobile_standings','vr_reaction_speed_standings','vr_reactific_standings','dynamic_memory_quarter_standings'],lista:{url:'https://sdaphocueugzfvjovuxd.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M'}}})();</script>
<script src="jugador.js"></script>
<script>window.MOVIL={game:'swipe-it',title:'Swipe It'};</script>
<script src="movil.js"></script>
</head>
<body>

<div class="screen" id="intro">
  <div class="top"><a class="pill" href="mobile-hub.html">← THE HUB</a><span></span></div>
  <div class="t">SWIPE <span>IT</span></div>
  <div class="sub" id="who">Reaction Velocity</div>
  <div class="how">
    <div><b>1</b>Keep your thumb off the screen</div>
    <div><b>2</b>An arrow appears ← → ↑ ↓</div>
    <div><b>3</b>Swipe that way, fast</div>
  </div>
  <input type="text" id="playerNameInputMain" class="name-input" maxlength="20" placeholder="Your name" autocomplete="off">
  <button class="go" id="startBtn" type="button">Start · 10 arrows</button>
</div>

<div class="screen" id="play" hidden>
  <div id="bar"><span id="rnd">1 / 10</span><span id="hits">0 hits</span></div>
  <div id="arrow"><svg viewBox="0 0 100 100"><path d="M50 8 L88 52 H62 V92 H38 V52 H12 Z" fill="#00e5ff"/></svg></div>
  <div id="msg"></div>
</div>

<div class="screen" id="end" hidden>
  <div class="big" id="endBpm">0</div>
  <div class="lab">Swipe It BPM</div>
  <div id="pbMsg"></div>
  <div class="hm" id="endHm"></div>
  <div class="card"><h3>Swipe by swipe</h3><div class="taps" id="taps"></div></div>
  <div class="card"><h3>My Progress · Swipe It</h3><div id="prog"></div></div>
  <div class="btns">
    <button class="go" id="againBtn" type="button">Play again</button>
    <button class="btn2" id="nextPlayerBtn" type="button">Next Player</button>
    <a class="btn2" href="mobile-hub.html">← THE HUB</a>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
var GUESS_MS=120;   // faster than any human reaction: a guess, counted as too early
var ROUNDS=10, WAIT_MIN=900, WAIT_MAX=2800, TOO_SLOW=2000, SWIPE_PX=40;
var DIRS={up:0,right:90,down:180,left:270}, NAMES=['up','right','down','left'];
var state='idle', round=0, results=[], waitT=null, slowT=null, t0=0, want='', start=null, playerName='';
(function(){var w=[MOVIL.school(),MOVIL.category()].filter(Boolean).join(' · ');if(w)$('who').textContent=w})();

function show(id){['intro','play','end'].forEach(function(s){$(s).hidden=(s!==id)})}
function msg(t,c){var m=$('msg');m.textContent=t||'';m.className=c||''}
function bar(){$('rnd').textContent=Math.min(round+1,ROUNDS)+' / '+ROUNDS;var h=results.filter(function(r){return r.ok}).length;$('hits').textContent=h+(h===1?' hit':' hits')}

$('startBtn').onclick=function(){
  if(!MOVIL.guard())return;
  var n=$('playerNameInputMain').value.trim();
  if(!n){$('playerNameInputMain').focus();return}
  playerName=n; MOVIL.unlock(); MOVIL.loadPast(n);
  round=0; results=[]; show('play'); next();
};
$('againBtn').onclick=function(){$('startBtn').click()};
$('nextPlayerBtn').addEventListener('click',function(){show('intro')});

function next(){
  clearTimeout(waitT);clearTimeout(slowT); start=null;
  state='wait'; $('arrow').className=''; bar(); msg('Get ready…');
  waitT=setTimeout(appear,WAIT_MIN+Math.random()*(WAIT_MAX-WAIT_MIN));
}
function appear(){
  if(state!=='wait')return;
  var prev=want; do{want=NAMES[Math.floor(Math.random()*4)]}while(want===prev&&Math.random()<.6);
  $('arrow').querySelector('svg').style.transform='rotate('+DIRS[want]+'deg)';
  $('arrow').className='on'; msg(''); t0=performance.now(); state='live';
  slowT=setTimeout(function(){done(false,0,'Too slow')},TOO_SLOW);
}
function done(ok,ms,why){
  if(state!=='live'&&state!=='wait')return;
  clearTimeout(waitT);clearTimeout(slowT);
  state='between'; $('arrow').className=''; start=null;
  results.push({ok:ok,ms:ms,why:why});
  if(ok){MOVIL.hitSound();msg(MOVIL.bpm(ms)+' BPM','good')}else{MOVIL.missSound();MOVIL.vibrate(80);msg(why,'bad')}
  round++; bar();
  setTimeout(function(){round>=ROUNDS?finish():next()},750);
}

var play=$('play');
play.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(state==='wait'){done(false,0,'Too early');return}
  if(state==='live'&&!start)start={x:e.clientX,y:e.clientY,id:e.pointerId};
});
play.addEventListener('pointermove',function(e){
  if(state!=='live'||!start||e.pointerId!==start.id)return;
  var dx=e.clientX-start.x, dy=e.clientY-start.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<SWIPE_PX)return;
  var got=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  if(got===want){var ms=performance.now()-t0; if(ms<GUESS_MS)done(false,0,'Too early'); else done(true,ms,'')}
  else done(false,0,'Wrong way');
});
function up(e){ if(state==='live'&&start&&e.pointerId===start.id)done(false,0,'Swipe, don’t tap') }
addEventListener('pointerup',up); addEventListener('pointercancel',function(e){ if(start&&e.pointerId===start.id)start=null });

function finish(){
  state='idle';
  var hits=results.filter(function(r){return r.ok}), misses=results.length-hits.length;
  var avg=hits.length?hits.reduce(function(a,r){return a+r.ms},0)/hits.length:0, bpm=MOVIL.bpm(avg);
  var early=results.filter(function(r){return r.why==='Too early'}).length;
  $('endBpm').textContent=bpm||'—';
  $('endHm').textContent=hits.length+' / '+ROUNDS+' hits'+(early?' · '+early+' too early':'');
  $('taps').innerHTML=results.map(function(r,i){return '<div'+(r.ok?'':' class="x"')+'>'+(i+1)+' · '+(r.ok?MOVIL.bpm(r.ms)+' BPM':MOVIL.esc(r.why))+'</div>'}).join('');
  $('pbMsg').innerHTML=MOVIL.bestHtml(bpm);
  $('prog').innerHTML=MOVIL.progressSvg(bpm);
  if(hits.length)MOVIL.save(playerName,bpm,hits.length,misses,Math.round(avg));
  show('end');
}
</script>
</body>
</html>
