<!-- ZONA ROJA — Zona with Reactific's rule: tap only the red. Encadena's five spots
     in the 2-1-2 zone; on every beat, at the player's Ritnome BPM, one spot lights up:
     red, or another color (blue, green, orange, yellow, purple — it keeps changing).
     Red: tap it before the next beat → a hit, +1. Wrong spot or too late → 1 off.
     Any other color: leave it. Tapping a spot while it shows → 1 off. Letting it pass costs nothing.
     The score never goes below 0. 10 or 25 REDS (the tabs; remembered on this device,
     10 until picked); about one other color for every two reds, never three in a row.
     Each red tap shows its own BPM. The score: out of 10 or out of 25.
     Saves to vr_mobile_standings: game_key 'zona-roja-10' or 'zona-roja-25',
     level = the score, hits, misses (incl. non-red taps), bpm = the BPM of the hits,
     avg_ms, device. -->

  function get(u){return fetch(MOVIL.SB_URL+u,H).then(function(r){return r.ok?r.json():[]}).catch(function(){return []})}
  Promise.all([get('/rest/v1/vr_mobile_standings?select=bpm&game_key=eq.home-base'+who+'&order=admin_id.desc&limit=1'),get('/rest/v1/vr_reaction_speed_standings?select=speed&speed=like.free-*'+who+'&order=admin_id.desc&limit=1')]).then(function(res){
    function keep(key,v){try{if(v>0&&!(parseInt(localStorage.getItem(key),10)>0))localStorage.setItem(key,String(v))}catch(e){}}
    var rs=(res[0]&&res[0][0])?parseInt(res[0][0].bpm,10)||0:0;
    var fr=(res[1]&&res[1][0])?parseInt(String(res[1][0].speed).split('-')[1],10)||0:0;
    keep(rsKey(x),rs);keep(freeKey(x),fr);
    if($('playerNameInputMain').value.trim().toLowerCase()===k&&!$('intro').hidden)refreshBox(true);
  });
}
function boxBPM(){var v=parseInt($('bpmInput').value,10);return isNaN(v)?0:Math.max(BPM_MIN,Math.min(BPM_MAX,v))}
function refreshBox(fromDb){
  var x=$('playerNameInputMain').value, v=x.trim()?savedBPM(x):0;
  if(!fromDb&&x.trim())askBest(x);
  $('bpmDown').disabled=$('bpmUp').disabled=$('bpmInput').disabled=!v; $('startBtn').disabled=!v;
  if(!v){$('bpmInput').value='';$('bpmNote').textContent=x.trim()?T('noRS'):T('fromRS');$('goRS').style.display=x.trim()?'block':'none';$('bpmBox').style.display=x.trim()?'none':'';$('bpmBox').classList.add('locked');return}
  $('goRS').style.display='none'; $('bpmBox').style.display=''; $('bpmBox').classList.remove('locked'); $('bpmBox').classList.add('active');
  if(!touched||!$('bpmInput').value)$('bpmInput').value=v;
  $('bpmNote').textContent=touched?T('mine'):T('rsNote');
}
function step(d){if($('bpmInput').disabled)return;touched=true;$('bpmInput').value=Math.max(BPM_MIN,Math.min(BPM_MAX,boxBPM()+d));refreshBox(true)}
$('bpmDown').onclick=function(){step(-5)}; $('bpmUp').onclick=function(){step(5)};
$('bpmInput').addEventListener('input',function(){touched=true});
$('bpmInput').addEventListener('change',function(){$('bpmInput').value=boxBPM()||'';refreshBox(true)});
$('playerNameInputMain').addEventListener('input',function(){touched=false;$('bpmInput').value='';refreshBox()});
document.addEventListener('DOMContentLoaded',function(){setTimeout(refreshBox,0)});

/* ── this player's past runs here, this length (best line and My Progress) ── */
var past=null;
function loadPast(x){
  past=null;
  var url=MOVIL.SB_URL+'/rest/v1/vr_mobile_standings?select=level,bpm,logged_at&hidden=is.false&game_key=eq.'+GAME()+'&school_name=eq.'+encodeURIComponent(MOVIL.school())+
    '&player_name=ilike.'+encodeURIComponent(String(x).trim().replace(/[*%,()]/g,''))+'&order=admin_id.asc';
  fetch(url,{headers:{apikey:MOVIL.SB_KEY,Authorization:'Bearer '+MOVIL.SB_KEY}}).then(function(r){return r.ok?r.json():null}).then(function(d){past=Array.isArray(d)?d:null}).catch(function(){});
}
function save(name,sc,bpm,hits,misses,avg){
  var row={game_key:GAME(),device:MOVIL.device(),player_name:String(name).trim().slice(0,20),school_name:MOVIL.school()||null,category:MOVIL.category()||null,bpm:bpm||null,hits:hits,misses:misses,avg_ms:avg||null,level:sc};
  function post(r){return fetch(MOVIL.SB_URL+'/rest/v1/vr_mobile_standings',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal',apikey:MOVIL.SB_KEY,Authorization:'Bearer '+MOVIL.SB_KEY},body:JSON.stringify(r)})}
  post(row).then(function(res){if(!res.ok){delete row.category;return post(row)}}).catch(function(){});
}

/* ── the 2-1-2 zone: five fixed spots ── */
function layout(){
  var p=$('play').getBoundingClientRect(), r=Math.max(34,Math.min(56,Math.min(p.width,p.height)*0.06));
  var cx=p.width/2, cy=p.height/2+10, dx=Math.min(p.width*0.30,200), dy=Math.min(p.height*0.24,190);
  SPOTS=[[cx-dx,cy-dy],[cx+dx,cy-dy],[cx,cy],[cx-dx,cy+dy],[cx+dx,cy+dy]].map(function(q){return {x:q[0],y:q[1],r:r}});
  $('spots').innerHTML=SPOTS.map(function(s){return '<div class="spotE" style="left:'+(s.x-s.r)+'px;top:'+(s.y-s.r)+'px;width:'+(2*s.r)+'px;height:'+(2*s.r)+'px"></div>'}).join('');
}
function mark(s,cls,txt,sub){
  var z=$('zt'), S=SPOTS[s]; z.className='zt '+cls; z.style.display='flex';
  z.style.left=(S.x-S.r)+'px'; z.style.top=(S.y-S.r)+'px'; z.style.width=z.style.height=(2*S.r)+'px';
  z.innerHTML=(txt||'')+(sub?'<small>'+sub+'</small>':'');
}
function unmark(){$('zt').style.display='none'}
function bar(){$('cnt').textContent=T('reds')+' '+reds+' / '+N;$('score').textContent=T('score')+' '+score}

/* ── start: countdown, then one target per beat ── */
$('startBtn').onclick=function(){
  if(!MOVIL.guard())return;
  var x=$('playerNameInputMain').value.trim(); if(!x){$('playerNameInputMain').focus();return}
  SPEED=boxBPM(); if(!SPEED)return;
  BEAT_MS=Math.round(60000/SPEED); playerName=x; MOVIL.unlock(); loadPast(x);
  idx=-1; cur=null; score=0; taps=[]; reds=0; seq=makeSeq(); clearAll(); show('play'); layout(); unmark(); $('flash').textContent='';
  $('spd').textContent=SPEED+' BPM'; bar();
  var c=3; $('bigCount').textContent=c; $('countdown').style.display='flex'; state='count';
  var iv=setInterval(function(){c--; if(c<=0){clearInterval(iv);$('countdown').style.display='none';state='run';beat()} else $('bigCount').textContent=c},1000);
};
$('againBtn').onclick=function(){show('intro');refreshBox(true);$('startBtn').click()};
$('nextPlayerBtn').addEventListener('click',function(){show('intro');touched=false;$('bpmInput').value='';refreshBox()});
addEventListener('resize',function(){if(!$('play').hidden)layout()});

// one beat: the last target (if not tapped) is a miss; the next spot lights up
function beat(){
  if(state!=='run')return;
  if(cur&&!cur.done){if(cur.red)result(false,'late',null);else unmark()}   // a red let go is a miss; another color let go is right
  idx++;
  if(idx>=seq.length){later(finish,700);return}
  var last=cur?cur.s:-1, s; do{s=Math.floor(Math.random()*5)}while(s===last);
  var red=seq[idx], col=RED; if(!red){var k;do{k=Math.floor(Math.random()*OTHER.length)}while(k===lastCol);lastCol=k;col=OTHER[k]} else reds++;
  cur={s:s,done:false,red:red}; t0=performance.now();
  mark(s,'lit'); var z=$('zt'); z.style.background=col; z.style.borderColor=col; z.style.boxShadow='0 0 34px '+col+'bb';
  MOVIL.tick(idx===0); bar();
  later(beat,BEAT_MS);
}
function result(ok,why,ms){
  cur.done=true; var z=$('zt'); z.style.background=z.style.borderColor=z.style.boxShadow='';
  if(ok){score++;taps.push({ok:true,ms:ms});mark(cur.s,'hit','✓',MOVIL.bpm(ms)+' BPM');MOVIL.hitSound()}
  else{score=Math.max(0,score-1);taps.push({ok:false,why:why});mark(cur.s,'miss','✗',T(why));MOVIL.missSound();MOVIL.vibrate(60)}
  bar();
}
var play=$('play');
play.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(state!=='run'||!cur||cur.done)return;
  var p=play.getBoundingClientRect(), x=e.clientX-p.left, y=e.clientY-p.top, best=-1, bd=1e9;
  SPOTS.forEach(function(s,i){var d=Math.hypot(x-s.x,y-s.y);if(d<bd){bd=d;best=i}});
  if(bd>SPOTS[0].r*2.2)return;                         // not near any spot: nothing happens
  var ms=performance.now()-t0; if(ms<GUESS_MS)return;  // a tap left over from the beat before
  if(!cur.red){result(false,'notRed',null);return}   // any tap while another color shows
  if(best===cur.s)result(true,null,ms); else result(false,'wrong',null);
});

/* ── the end: the score out of 10 or 25 ── */
function levelSvg(now){
  var pts=(past||[]).filter(function(r){return r.level!=null}).map(function(r){return +r.level||0});
  if(now!=null)pts.push(now); pts=pts.slice(-20);
  if(pts.length<2)return '<div style="color:#8fa0b4;font-size:.82rem;text-align:center;padding:10px">'+T('againLine')+'</div>';
  var W=340,Hh=150,L=26,R=10,Tp=12,B=20, lo=0, hi=N;
  var X=function(i){return L+(W-L-R)*i/(pts.length-1)}, Y=function(v){return Tp+(Hh-Tp-B)*(hi-v)/(hi-lo)};
  var s='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;display:block">', st=N===10?2:5;
  for(var y=0;y<=hi;y+=st)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-6)+'" y="'+(Y(y)+4)+'" fill="#8fa0b4" font-size="10" text-anchor="end">'+y+'</text>';
  s+='<polyline fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(v,i){var l=i===pts.length-1;s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(l?5.5:3.5)+'" fill="'+(l?'#ffd35a':'#fb7185')+'"/>'});
  return s+'</svg>';
}
function bestLine(now){
  if(!past)return '';
  var prev=-1;past.forEach(function(r){if(r.level!=null){var v=+r.level||0;if(v>prev)prev=v}});
  var big='font-size:1.15rem;font-weight:900;letter-spacing:.06em;color:#ffd35a;text-shadow:0 0 18px rgba(255,211,90,.6)', small='font-size:.82rem;color:#c8ccd4;margin-top:3px';
  if(prev<0)return '<div style="'+big+'">⭐ '+T('first')+'</div><div style="'+small+'">'+now+'/'+N+' — '+T('firstSub')+'</div>';
  if(now>prev)return '<div style="'+big+'">⭐ '+T('pb')+'</div><div style="'+small+'">'+now+'/'+N+' · '+T('was')+' '+prev+'/'+N+'</div>';
  return '<div style="'+small+'">'+T('best')+' '+prev+'/'+N+'</div>';
}
function finish(){
  state='idle'; clearAll(); unmark(); $('flash').textContent='';
  var hits=taps.filter(function(t){return t.ok}), ms=hits.map(function(t){return t.ms});
  var avg=ms.length?ms.reduce(function(a,b){return a+b},0)/ms.length:0, bpm=avg?MOVIL.bpm(avg):0;
  $('endBig').textContent=score+'/'+N;
  $('endLab').textContent=T('lab')(N);
  var nr=taps.filter(function(t){return t.why==='notRed'}).length;
  $('endHm').textContent=hits.length+' '+T('hits')+' · '+(taps.length-hits.length-nr)+' '+T('misses')+' · '+nr+' '+T('nrTaps')+(bpm?' · '+bpm+' '+T('bpmHits'):'')+' · '+T('at')+' '+SPEED+' BPM';
  $('tapList').innerHTML=taps.map(function(t,i){return '<div'+(t.ok?'':' class="x"')+'>'+(i+1)+' · '+(t.ok?'✓ '+MOVIL.bpm(t.ms):'✗ '+T(t.why))+'</div>'}).join('');
  $('progT').textContent=T('prog')(N);
  $('pbMsg').innerHTML=bestLine(score);
  $('prog').innerHTML=levelSvg(score);
  save(playerName,score,bpm,hits.length,taps.length-hits.length,Math.round(avg));
  show('end');
}
applyLang();
</script>
