<!-- REACTION SPEED (built as Home Base; the old tap game is vr-reaction-speed-classic.html).
     Same file in reaction-velocity and cognitivo-gym-paradiso: it opens with a
     Reaction Velocity code, a Cognitivo Gym code or a Reaction Mobile code.
     Hold a thumb on HOME. After a random wait an arrow appears, the same
     arrow and size as Swipe It, pointing up, down, left or right: lift off
     and swipe it the way it points. The time from the arrow to the swipe is
     the reaction, shown in BPM. Lifting early, or a swipe under 120 ms (a
     guess, not a reaction) = too early (a miss); touching while still on
     HOME, off the arrow, the wrong way, a tap instead of a swipe, or no
     swipe within 2 seconds = a miss.
     10 rounds. Saves to vr_mobile_standings (game_key 'home-base', with the
     device). Its BPM is what Reactific and Swipe It start from. -->
<script>try{if(sessionStorage.getItem('gym-plain')==='1')document.documentElement.classList.add('plain')}catch(e){}</script>
<style>

#home{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));width:clamp(110px,16vmin,160px);height:clamp(110px,16vmin,160px);transform:translateX(-50%);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;letter-spacing:.12em;

}

  .bpm-row{margin:8px 0 2px}
  .bpm-step{width:46px;height:46px}
  #bpmInput{padding:7px;font-size:1.4rem}
}

<script>
var $=function(id){return document.getElementById(id)};
/* ── language: opens in Spanish; EN / ES on the start screen (remembered on this device) ── */
var TX={
  es:{s1:'Mantén el pulgar en HOME',s2:'Espera: aparece una flecha',s3:'Suelta y deslízala hacia donde apunta',start:'▶ Empezar · 10 rondas',hint:'Mantén el pulgar en HOME. Cuando aparezca la flecha, suelta y deslízala hacia donde apunta — rápido. 10 rondas.',name:'Tu nombre',hub:'← EL HUB',exit:'← Salir',newp:'Nuevo jugador',
      rit:function(b){return '🥁 Tu Ritnome · '+b+' BPM'},lab:'BPM de Reaction Speed',taps:'Toque a toque',prog:'Mi progreso · Reaction Speed',again:'Jugar otra vez',next:'Siguiente juego: Zona →',nextp:'Siguiente jugador',
      hold:'Mantén HOME',wait:'Espera…',relift:'Suelta y vuelve a mantener HOME',hit:'acierto',hits:'aciertos',early:'muy temprano',
      'Too early':'Muy temprano','Too slow':'Muy lento','Lift off HOME first':'Suelta HOME primero','Missed the target':'Fallaste el objetivo','Off the arrow':'Fuera de la flecha','Wrong way':'Dirección equivocada','Swipe, don’t tap':'Desliza, no toques'},
  en:{s1:'Hold your thumb on HOME',s2:'Wait — an arrow appears',s3:'Lift off and swipe it the way it points',start:'▶ Start · 10 rounds',hint:'Hold your thumb on HOME. When the arrow appears, lift off and swipe it the way it points — fast. 10 rounds.',name:'Your name',hub:'← THE HUB',exit:'← Exit',newp:'New player',
      rit:function(b){return '🥁 Your Ritnome · '+b+' BPM'},lab:'Reaction Speed BPM',taps:'Tap by tap',prog:'My Progress · Reaction Speed',again:'Play again',next:'Next game: Zona →',nextp:'Next Player',
      hold:'Hold HOME',wait:'Wait for it…',relift:'Lift off, then hold HOME again',hit:'hit',hits:'hits',early:'too early',
      'Too early':'Too early','Too slow':'Too slow','Lift off HOME first':'Lift off HOME first','Missed the target':'Missed the target','Off the arrow':'Off the arrow','Wrong way':'Wrong way','Swipe, don’t tap':'Swipe, don’t tap'}
};
var LANG='es'; try{if(localStorage.getItem('rs-lang')==='en')LANG='en'}catch(e){}
function T(k){return (TX[LANG]&&TX[LANG][k])||TX.en[k]||k}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=T(el.getAttribute('data-t'))});
  $('playerNameInputMain').placeholder=T('name');
  document.querySelectorAll('#intro .intro-back').forEach(function(a){a.textContent=T('exit')});
  document.querySelectorAll('#end a.btn2:not(#nextGameBtn)').forEach(function(a){a.textContent=T('hub')});
  var np=document.querySelector('.jg-como a'); if(np)np.textContent=T('newp');   // the player chip (jugador.js)
  document.querySelectorAll('.lg').forEach(function(b){var on=b.getAttribute('data-l')===LANG;b.classList.toggle('on',on);b.classList.toggle('active',on)});
}
document.querySelectorAll('.lg').forEach(function(b){b.onclick=function(){LANG=b.getAttribute('data-l');try{localStorage.setItem('rs-lang',LANG)}catch(e){}applyLang()}});
applyLang();
document.addEventListener('DOMContentLoaded',function(){setTimeout(applyLang,0)});   // after jugador.js adds the player chip
var GUESS_MS=120;   // faster than any human reaction: a guess, counted as too early
var ROUNDS=10, WAIT_MIN=1000, WAIT_MAX=3500, TOO_SLOW=2000;   // a swipe takes a little longer than a tap: 2 s
var DIRS={up:0,right:90,down:180,left:270}, NAMES=['up','right','down','left'], want='up', swipe=null;
var state='idle', round=0, results=[], homeId=null, homeHeld=false, waitT=null, slowT=null, t0=0, playerName='';
(function(){var w=[MOVIL.school(),MOVIL.category()].filter(Boolean).join(' · ');if(w)$('who').textContent=w})();

function show(id){['intro','play','end'].forEach(function(s){$(s).hidden=(s!==id)})}
function msg(t,c){var m=$('msg');m.textContent=t||'';m.className=c||''}
function bar(){$('rnd').textContent=Math.min(round+1,ROUNDS)+' / '+ROUNDS;var h=results.filter(function(r){return r.ok}).length;$('hits').textContent=h+' '+(h===1?T('hit'):T('hits'))}

$('startBtn').onclick=function(){
  if(!MOVIL.guard())return;
  var n=$('playerNameInputMain').value.trim();
  if(!n){$('playerNameInputMain').focus();return}
  playerName=n; MOVIL.unlock(); MOVIL.loadPast(n);
  round=0; results=[]; show('play'); arm();
};
$('againBtn').onclick=function(){$('startBtn').click()};
$('nextPlayerBtn').addEventListener('click',function(){show('intro')});

function arm(){
  clearTimeout(waitT);clearTimeout(slowT);
  state='armed'; $('tgt').style.display='none'; $('home').className='ready'; bar();
  msg(homeHeld?T('relift'):T('hold'));
}
function place(){
  var p=$('play').getBoundingClientRect(), r=parseFloat(getComputedStyle($('tgt')).width)/2||42, home=$('home').getBoundingClientRect();
  var top=70+r, bottom=home.top-40-r, left=r+8, right=p.width-r-8;
  if(bottom<top)bottom=top;
  var x=left+Math.random()*(right-left), y=top+Math.random()*(bottom-top);
  want=NAMES[Math.floor(Math.random()*4)]; swipe=null;
  var t=$('tgt'); t.querySelector('svg').style.transform='rotate('+DIRS[want]+'deg)';
  t.style.left=(x-r)+'px'; t.style.top=(y-r)+'px'; t.style.display='flex'; t.dataset.cx=x+p.left; t.dataset.cy=y+p.top; t.dataset.r=r;
}
function light(){
  if(state!=='holding')return;
  place(); msg(''); t0=performance.now(); state='live';
  slowT=setTimeout(function(){done(false,0,'Too slow')},TOO_SLOW);
}
function done(ok,ms,why){
  if(state!=='live'&&state!=='holding')return;
  clearTimeout(waitT);clearTimeout(slowT);
  state='between'; $('tgt').style.display='none';
  results.push({ok:ok,ms:ms,why:why});
  if(ok){MOVIL.hitSound();msg(MOVIL.bpm(ms)+' BPM','good')}else{MOVIL.missSound();MOVIL.vibrate(80);msg(T(why),'bad')}
  round++; bar();
  setTimeout(function(){round>=ROUNDS?finish():arm()},750);
}

// HOME: press and hold
$('home').addEventListener('pointerdown',function(e){
  e.preventDefault();
  homeHeld=true; homeId=e.pointerId; $('home').className='held';
  if(state==='armed'){state='holding';msg(T('wait'));waitT=setTimeout(light,WAIT_MIN+Math.random()*(WAIT_MAX-WAIT_MIN))}
});
function homeUp(e){
  if(e.pointerId!==homeId)return;
  homeHeld=false; homeId=null;
  if(state==='holding'){done(false,0,'Too early')}
  else{ $('home').className=state==='armed'?'ready':''; if(state==='armed')msg(T('hold')) }
}
addEventListener('pointerup',homeUp); addEventListener('pointercancel',homeUp);

// the arrow: touch it and swipe the way it points (as in Swipe It)
$('play').addEventListener('pointerdown',function(e){
  if(e.target.id==='home')return;
  e.preventDefault();
  if(state!=='live'||swipe)return;
  if(homeHeld){done(false,0,'Lift off HOME first');return}
  var a=$('tgt'), dx=e.clientX-a.dataset.cx, dy=e.clientY-a.dataset.cy;
  if(Math.sqrt(dx*dx+dy*dy)>a.dataset.r*1.8){done(false,0,'Off the arrow');return}   // a little extra room for a finger
  swipe={x:e.clientX,y:e.clientY,id:e.pointerId};
});
$('play').addEventListener('pointermove',function(e){
  if(state!=='live'||!swipe||e.pointerId!==swipe.id)return;
  var dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
  var got=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'), ms=performance.now()-t0;
  swipe=null;
  if(got!==want)done(false,0,'Wrong way'); else if(ms<GUESS_MS)done(false,0,'Too early'); else done(true,ms,'');
});
addEventListener('pointerup',function(e){if(state==='live'&&swipe&&e.pointerId===swipe.id){swipe=null;done(false,0,'Swipe, don’t tap')}});

function finish(){
  state='idle';
  var hits=results.filter(function(r){return r.ok}), misses=results.length-hits.length;
  var avg=hits.length?hits.reduce(function(a,r){return a+r.ms},0)/hits.length:0, bpm=MOVIL.bpm(avg);
  var early=results.filter(function(r){return r.why==='Too early'}).length;
  $('endBpm').textContent=bpm||'—';
  $('endHm').textContent=hits.length+' / '+ROUNDS+' '+T('hits')+(early?' · '+early+' '+T('early'):'');
  $('taps').innerHTML=results.map(function(r,i){return '<div'+(r.ok?'':' class="x"')+'>'+(i+1)+' · '+(r.ok?MOVIL.bpm(r.ms)+' BPM':MOVIL.esc(T(r.why)))+'</div>'}).join('');
  $('pbMsg').innerHTML=MOVIL.bestHtml(bpm,LANG);
  $('prog').innerHTML=MOVIL.progressSvg(bpm,LANG);
  if(hits.length)MOVIL.save(playerName,bpm,hits.length,misses,Math.round(avg));
  // Reactific and Swipe It start at this player's CURRENT Reaction Speed BPM (this run)
  if(bpm>0){try{localStorage.setItem('rv-rs-bpm:'+playerName.trim().toLowerCase(),String(bpm))}catch(e){}}
  // Ritnome: the congas at the BPM the kid just got (touch to play)
  if(bpm>0&&window.RITNOME){RITNOME.stop();RITNOME.mount($('ritnome'),{bpm:bpm,lang:LANG});$('ritTitle').textContent=TX[LANG].rit(RITNOME.bpm);$('ritCard').hidden=false}
  else $('ritCard').hidden=true;
  show('end');
}
// leaving the end screen (Play again, next game, next player, the hub) stops the congas
$('end').addEventListener('click',function(e){if(window.RITNOME&&e.target.closest('a,button')&&!e.target.closest('#ritnome'))RITNOME.stop()},true);
</script>
