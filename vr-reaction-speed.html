<!-- REACTION SPEED (built as Home Base; the old tap game is vr-reaction-speed-classic.html).
     Same file in reaction-velocity and cognitivo-gym-paradiso: it opens with a
     Reaction Velocity code, a Cognitivo Gym code or a Reaction Mobile code.
     Hold a thumb on HOME. The arrow scrolls around, turning, and after a random time stops, the same
     arrow and size as Swipe It, pointing up, down, left or right: lift off
     and swipe it the way it points. The time from the arrow to the swipe is
     the reaction, shown in BPM. Lifting early, or a swipe under 120 ms (a
     guess, not a reaction) = too early (a miss); touching while still on
     HOME, off the arrow, the wrong way, a tap instead of a swipe, or no
     swipe within 2 seconds = a miss.
     10 or 25 rounds (the tabs). Saves to vr_mobile_standings (game_key 'home-base', with the
     device). Its BPM is what Reactific and Swipe It start from. -->

function T(k){var v=(TX[LANG]&&TX[LANG][k])||TX.en[k]||k;return (k==='start'||k==='hint')?String(v).replace(/\b10\b/g,ROUNDS):v}

// HOME's spot each round: one of the four corners, at random (never the center) — never 3 rounds
// in a row in the same spot. Either hand. The clock only starts when the arrow stops,
// so finding HOME never counts against the BPM.
var homeAt=[];
// the four corners, measured from the play area (HOME's center): 0 upper left · 1 upper right · 2 lower left · 3 lower right
function spotXY(k){
  var p=$('play').getBoundingClientRect(), s=$('home').offsetWidth||130, h=s/2, W=p.width, H=p.height;
  var safe=parseFloat(getComputedStyle($('play')).paddingBottom)||0, edge=Math.max(16,W*.06), up=64+h, down=H-46-safe-h;
  return [[edge+h,up],[W-edge-h,up],[edge+h,down],[W-edge-h,down]][k];

function putHome(k){var c=spotXY(k);$('home').style.left=c[0]+'px';$('home').style.top=c[1]+'px'}
function moveHome(){
  var k; do{k=Math.floor(Math.random()*4)}while(homeAt.length>=2&&homeAt[homeAt.length-1]===k&&homeAt[homeAt.length-2]===k);
  var moved=homeAt.length&&homeAt[homeAt.length-1]!==k; homeAt.push(k);
  putHome(k); return moved;
}
addEventListener('resize',function(){if(homeAt.length)putHome(homeAt[homeAt.length-1])});

  clearTimeout(waitT);clearTimeout(slowT);clearTimeout(moveT);

  $('home').className=moved?'ready moved':'ready'; bar();

}

function clearXY(p,r,home,from){

  var hx=home.left+home.width/2-p.left, hy=home.top+home.height/2-p.top, keep=home.width/2+r+36, far=Math.min(p.width,p.height)*.35;

  for(var i=0;i<80;i++){   // the best one tried, if the screen is tight
    x=left+Math.random()*(right-left); y=top+Math.random()*(bottom-top);
    var d=Math.hypot(x-hx,y-hy), f=from?Math.hypot(x-from[0],y-from[1]):far, sc=Math.min(d/keep,f/far);
    if(sc>=1)return [x,y]; if(sc>bs){bs=sc;best=[x,y]}
  }
  return best;
}
// While HOME is held the arrow scrolls around the screen, pointing a new way on every
// leg. After the random wait it makes its final stop: the strobing frame comes on, its
// direction is the one to swipe, and only then does the clock start.
var moveT;
function geo(){var p=$('play').getBoundingClientRect();return {p:p,r:parseFloat(getComputedStyle($('tgt')).width)/2||42,home:$('home').getBoundingClientRect()}}
function aim(d){$('tgt').querySelector('svg').style.transform='rotate('+DIRS[d]+'deg)'}
function startMove(){
  var g=geo(), t=$('tgt'), at=clearXY(g.p,g.r,g.home), last=null, left=WAIT_MIN+Math.random()*(WAIT_MAX-WAIT_MIN);
  t.classList.remove('strobe'); t.style.transition='none'; t.style.left=(at[0]-g.r)+'px'; t.style.top=(at[1]-g.r)+'px'; t.style.display='flex';
  function turn(){var d; do{d=NAMES[Math.floor(Math.random()*4)]}while(d===last); last=d; aim(d)}
  turn(); msg('');
  function leg(){
    if(state!=='holding')return;
    if(left<=0){stop(at,g);return}
    var dur=Math.min(left,380+Math.random()*320); left-=dur;
    var nx=clearXY(g.p,g.r,g.home,at); at=nx;
    t.style.transition='left '+dur+'ms ease-in-out,top '+dur+'ms ease-in-out';
    t.style.left=(nx[0]-g.r)+'px'; t.style.top=(nx[1]-g.r)+'px'; turn();
    moveT=setTimeout(leg,dur);
  }
  void t.offsetWidth; leg();
}
function stop(xy,g){
  var t=$('tgt'); t.style.transition='none';
  want=NAMES[Math.floor(Math.random()*4)]; swipe=null; aim(want);
  t.dataset.cx=xy[0]+g.p.left; t.dataset.cy=xy[1]+g.p.top; t.dataset.r=g.r;
  t.classList.add('strobe'); t0=performance.now(); state='live';
  slowT=setTimeout(function(){done(false,0,'Too slow')},TOO_SLOW);
}
function done(ok,ms,why){
  if(state!=='live'&&state!=='holding')return;
  clearTimeout(waitT);clearTimeout(slowT);clearTimeout(moveT);
  state='between'; $('tgt').style.display='none'; $('tgt').classList.remove('strobe');
  results.push({ok:ok,ms:ms,why:why});
  if(ok){MOVIL.hitSound();msg(MOVIL.bpm(ms)+' BPM','good')}else{MOVIL.missSound();MOVIL.vibrate(80);msg(T(why),'bad')}
  round++; bar();
  setTimeout(function(){hitCount()>=ROUNDS?finish():arm()},750);
}

// HOME: press and hold
$('home').addEventListener('pointerdown',function(e){
  e.preventDefault();
  homeHeld=true; homeId=e.pointerId; $('home').className='held';
  if(state==='armed'){state='holding';startMove()}
});
function homeUp(e){
  if(e.pointerId!==homeId)return;
  homeHeld=false; homeId=null;
  if(state==='holding'){done(false,0,'Too early')}
  else{ if(state==='armed'&&moveHome())$('home').className='ready moved'; else $('home').className=state==='armed'?'ready':''; if(state==='armed')msg(T('hold')) }
}
addEventListener('pointerup',homeUp); addEventListener('pointercancel',homeUp);

// the arrow: touch it and swipe the way it points (as in Swipe It)
$('play').addEventListener('pointerdown',function(e){
  if(e.target.id==='home')return;
  e.preventDefault();
  if(state!=='live'||swipe)return;
  if(homeHeld){done(false,0,'Lift off HOME first');return}
  var a=$('tgt'), dx=e.clientX-a.dataset.cx, dy=e.clientY-a.dataset.cy;
  if(Math.sqrt(dx*dx+dy*dy)>a.dataset.r*1.8){done(false,0,'Off the arrow');return}   // a little extra room for a finger
  swipe={x:e.clientX,y:e.clientY,id:e.pointerId};
});
$('play').addEventListener('pointermove',function(e){
  if(state!=='live'||!swipe||e.pointerId!==swipe.id)return;
  var dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
  var got=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'), ms=performance.now()-t0;
  swipe=null;
  if(got!==want)done(false,0,'Wrong way'); else if(ms<GUESS_MS)done(false,0,'Too early'); else done(true,ms,'');
});
addEventListener('pointerup',function(e){if(state==='live'&&swipe&&e.pointerId===swipe.id){swipe=null;done(false,0,'Swipe, don’t tap')}});

function finish(){
  state='idle';
  var hits=results.filter(function(r){return r.ok}), misses=results.length-hits.length;
  var avg=hits.length?hits.reduce(function(a,r){return a+r.ms},0)/hits.length:0, bpm=MOVIL.bpm(avg);
  var early=results.filter(function(r){return r.why==='Too early'}).length;
  $('endBpm').textContent=bpm||'—';
  $('endHm').textContent=hits.length+' '+T('hits')+' · '+misses+' '+(misses===1?T('miss1'):T('missN'))+(early?' ('+early+' '+T('early')+')':'');
  $('taps').innerHTML=results.map(function(r,i){return '<div'+(r.ok?'':' class="x"')+'>'+(i+1)+' · '+(r.ok?MOVIL.bpm(r.ms)+' BPM':MOVIL.esc(T(r.why)))+'</div>'}).join('');
  $('pbMsg').innerHTML=MOVIL.bestHtml(bpm,LANG);
  $('prog').innerHTML=MOVIL.progressSvg(bpm,LANG);
  if(hits.length)MOVIL.save(playerName,bpm,hits.length,misses,Math.round(avg));
  // Reactific and Swipe It start at this player's CURRENT Reaction Speed BPM (this run)
  if(bpm>0){try{localStorage.setItem('rv-rs-bpm:'+playerName.trim().toLowerCase(),String(bpm))}catch(e){}}
  // Ritnome: the congas at the BPM the kid just got (touch to play)
  if(bpm>0&&window.RITNOME){RITNOME.stop();RITNOME.mount($('ritnome'),{bpm:bpm,lang:LANG});$('ritTitle').textContent=TX[LANG].rit(RITNOME.bpm);$('ritCard').hidden=false}
  else $('ritCard').hidden=true;
  show('end');
}
// leaving the end screen (Play again, next game, next player, the hub) stops the congas
$('end').addEventListener('click',function(e){if(window.RITNOME&&e.target.closest('a,button')&&!e.target.closest('#ritnome'))RITNOME.stop()},true);
</script>
