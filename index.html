<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reaction Velocity · Access</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;color:#fff;
    background:#000;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }

  #stage{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:#000;
  }

  #panel{width:100%;max-width:400px;text-align:center}
  .sub{font-size:.85rem;color:#9fb3c8;letter-spacing:.02em;margin-bottom:44px}

  .code-panel{width:100%}
  .code-label{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8892a0;margin-bottom:10px}
  .code-input{
    width:100%;padding:16px;border-radius:12px;border:2px solid rgba(255,107,53,.4);
    background:rgba(255,255,255,.05);color:#fff;font-size:1.4rem;font-weight:900;
    letter-spacing:.25em;text-transform:uppercase;text-align:center;font-family:'Courier New',monospace;
  }
  .code-input:focus{outline:none;border-color:#FF6B35;box-shadow:0 0 24px rgba(255,107,53,.35)}
  .code-input.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .enter-btn{
    width:100%;margin-top:16px;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#FF6B35,#ff8a5c);color:#fff;
    font-size:1rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 0 30px rgba(255,107,53,.5);
  }
  .enter-btn:active{transform:scale(.98)}

  .err{margin-top:14px;color:#ff8888;font-size:.85rem;font-weight:700;min-height:18px}
  /* 👤 New player? Join here */
  .join-link{display:inline-block;margin-top:18px;color:#00e5ff;font-size:.82rem;font-weight:800;letter-spacing:.04em;text-decoration:none;border-bottom:1px dashed rgba(0,229,255,.5);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;font-family:inherit}
  .join-panel{display:none;margin-top:14px}
  .join-panel.open{display:block}
  .join-panel .code-input{margin-bottom:10px}
  .join-done{display:none;margin-top:6px}
  .join-done .big-code{font-size:2.2rem;font-weight:900;letter-spacing:.12em;color:#00e5ff;text-shadow:0 0 24px rgba(0,229,255,.5);margin:8px 0}
  .join-done .hint{color:#c8ccd4;font-size:.9rem;line-height:1.5;margin-bottom:14px}

  .brandmark{margin-top:50px;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4a5058}
  .brandmark b{color:#8892a0;font-style:italic}

  .gate-title{font-size:1.8rem;font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 30px rgba(255,107,53,.6)}
  .gate-title span{color:#FF6B35}
  @media(max-width:480px){ .gate-title{font-size:1.35rem} }
</style>
</head>
<body>

<div id="stage">
  <div id="panel">
    <div class="gate-title">REACTION <span>VELOCITY</span></div>
    <div class="sub" id="gate-sub">Enter Your Access Code</div>

    <div class="code-panel" id="code-panel">
      <div class="code-label">Access Code</div>
      <input class="code-input" id="gate-code" maxlength="40" placeholder="• • • •" autocomplete="off" onkeydown="if(event.key==='Enter')tryEnter()">
      <button class="enter-btn" onclick="tryEnter()">Enter Reaction Velocity →</button>
      <div class="err" id="gate-err"></div>
      <button type="button" class="join-link" id="join-open" onclick="openJoin()">👤 New player? Join here</button>
    </div>

    <!-- 👤 NEW PLAYER: the school code from the class + the kid's name → the kid's own code -->
    <div class="code-panel join-panel" id="join-panel">
      <div class="code-label">School code (from your class)</div>
      <input class="code-input" id="join-school" maxlength="40" placeholder="• • • •" autocomplete="off">
      <div class="code-label">Player's first and last name</div>
      <input class="code-input" id="join-name" maxlength="20" placeholder="Ana Rivera" autocomplete="off" style="text-transform:none;letter-spacing:.02em" onkeydown="if(event.key==='Enter')tryJoin()">
      <button class="enter-btn" onclick="tryJoin()">Get my player code →</button>
      <div class="err" id="join-err"></div>
      <div class="join-done" id="join-done">
        <div class="code-label" id="join-who"></div>
        <div class="big-code" id="join-code"></div>
        <div class="hint">✏️ Write this code down — it is yours. Next time, type it in the Access Code box: the games will know it's you.</div>
        <button class="enter-btn" onclick="enterJoined()">Play now →</button>
      </div>
    </div>

    <div class="brandmark">Powered by <b>Gostar Digital</b></div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  LICENSE SYSTEM — this is its own separate repo, so it uses
//  its own distinct session key ('reaction-velocity-gate-pass') and
//  its own distinct product scope ('reaction-velocity') in the SAME
//  Supabase licenses table every other product already uses. A code
//  issued for any other product on this platform will NOT unlock
//  this gate, and vice versa, even though all of them live in the
//  same table. To issue / expire / revoke Reaction Velocity licenses,
//  admin.html needs a matching product tab for 'reaction-velocity'.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'reaction-velocity';
// ══════════════════════════════════════════════════════

// The code is checked by the database's check_access function — the
// same check the Cognitivo Gym uses. The licenses table itself can no
// longer be read from a page, which is why the old direct lookup said
// "Invalid code" to every code. check_access answers only yes or no
// (plus the school name), judges expiry on the database's own clock,
// and counts devices for codes that have a device limit.
function deviceId(){
  var id = null;
  try { id = localStorage.getItem('gostar-device-id'); } catch(e){}
  if (!id){
    id = 'd-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    try { localStorage.setItem('gostar-device-id', id); } catch(e){}
  }
  return id;
}

var checking = false;
function tryEnter(){
  if (checking) return;
  var input = $('gate-code').value.trim();
  if (!input){ return; }
  checking = true;
  $('gate-err').style.color = '';
  $('gate-err').textContent = 'Checking…';

  fetch(SUPABASE_URL + '/rest/v1/rpc/check_access', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_code: input, p_product: PRODUCT, p_device: deviceId() })
  })
  .then(function(r){
    if (!r.ok) throw new Error('lookup failed');
    return r.json();
  })
  .then(function(lic){
    checking = false;
    if (!lic || !lic.ok){
      if (lic && lic.reason === 'devices'){
        return reject('This code is already in use on ' + (lic.max_devices || 5) +
                      ' devices. Ask your administrator to reset it.');
      }
      if (lic && lic.reason === 'expired'){ return reject('This license has expired'); }
      if (lic && lic.reason === 'revoked'){ return reject('This code is no longer active.'); }
      return reject('Invalid code — check with your administrator');
    }
    sessionStorage.setItem('reaction-velocity-gate-pass','1');
    sessionStorage.setItem('reaction-velocity-license', input.toUpperCase());
    sessionStorage.setItem('reaction-velocity-school', lic.school_name || '');
    sessionStorage.removeItem('gym-player-ok');     // a new sign-in asks "who's playing?" again (jugador.js)
    // The code's age group (set in License Admin) goes with every saved run.
    // No category, or no answer, simply means none — never a block.
    return fetch(SUPABASE_URL + '/rest/v1/rpc/license_category', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_code: input, p_product: PRODUCT })
    })
    .then(function(r){ return r.ok ? r.json() : null })
    .catch(function(){ return null })
    .then(function(cat){
      sessionStorage.setItem('reaction-velocity-category', (typeof cat === 'string' ? cat : '') || '');
      // 👤 a player code (License Admin → Player codes) carries the kid's name:
      // every game then plays as that kid — no "Who's playing?", no list of classmates.
      return fetch(SUPABASE_URL + '/rest/v1/rpc/license_player', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: input, p_product: PRODUCT })
      })
      .then(function(r){ return r.ok ? r.json() : null })
      .catch(function(){ return null })
      .then(function(kid){
        kid = (typeof kid === 'string' ? kid.trim() : '');
        if (kid) { sessionStorage.setItem('reaction-velocity-player', kid); try { localStorage.setItem('gym-player', kid) } catch(e){} sessionStorage.setItem('gym-player-ok', '1') }
        else sessionStorage.removeItem('reaction-velocity-player');
      });
    })
    .then(function(){
      // TARGETS — a code can be set to plain circles (License Admin → Targets),
      // the school look: no basketball seams, no Fortress court. No answer = basketballs.
      return fetch(SUPABASE_URL + '/rest/v1/rpc/license_plain', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: input, p_product: PRODUCT })
      })
      .then(function(r){ return r.ok ? r.json() : null })
      .catch(function(){ return null })
      .then(function(plain){
        sessionStorage.setItem('gym-plain', plain === true ? '1' : '');
        window.location.href = 'reaction-velocity.html';
      });
    });
  })
  .catch(function(){
    checking = false;
    reject('Connection problem — please try again');
  });
}

// ── 👤 New player? Join here ──
function openJoin(){
  $('code-panel').style.display = 'none'; $('join-panel').classList.add('open');
  $('gate-sub').textContent = 'New Player'; $('join-school').focus();
}
var joining = false, joinedCode = '';
function tryJoin(){
  if (joining) return;
  var sc = $('join-school').value.trim(), nm = $('join-name').value.trim().replace(/\s+/g, ' ');
  function bad(m){ $('join-err').style.color = '#ff8888'; $('join-err').textContent = m; }
  if (!sc){ bad('Type the school code from your class'); $('join-school').focus(); return; }
  if (nm.split(' ').length < 2){ bad('Type the first and last name'); $('join-name').focus(); return; }
  joining = true; $('join-err').style.color = ''; $('join-err').textContent = 'Making your code…';
  fetch(SUPABASE_URL + '/rest/v1/rpc/rv_join', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_school_code: sc, p_name: nm })
  })
  .then(function(r){ if (!r.ok) throw new Error('join'); return r.json(); })
  .then(function(d){
    joining = false;
    if (!d || !d.ok){
      var why = d && d.reason;
      return bad(why === 'closed' ? 'This school code does not take new players — ask your teacher for your code.'
               : why === 'exists' ? 'This player is already signed up — ask your teacher for the code.'
               : why === 'name'   ? 'Type the first and last name (letters only).'
               : why === 'busy'   ? 'Too many new players today — please try again tomorrow.'
               : 'Check the school code with your teacher.');
    }
    joinedCode = d.code;
    $('join-err').textContent = '';
    ['join-school','join-name'].forEach(function(id){ $(id).style.display = 'none'; });
    $('join-panel').querySelectorAll('.code-label:not(#join-who), .join-panel > .enter-btn').forEach(function(x){ x.style.display = 'none'; });
    $('join-who').textContent = '👤 ' + d.name + (d.school ? ' · ' + d.school : '');
    $('join-code').textContent = d.code;
    $('join-done').style.display = 'block';
  })
  .catch(function(){ joining = false; bad('Connection problem — please try again'); });
}
// the new code signs in like any code
function enterJoined(){
  $('join-panel').classList.remove('open'); $('code-panel').style.display = '';
  $('gate-code').value = joinedCode; tryEnter();
}

function reject(msg){
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value=''; box.focus();
}

// No auto-focus on load — in VR, focusing an input field automatically
// can trigger the headset's own virtual keyboard or a browser UI
// reflow, a plausible source of the panel destabilizing right as the
// page appears. Focus only happens now in response to a genuine user
// action (a rejected code), never automatically.
</script>
</body>
</html>
